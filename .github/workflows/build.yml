name: build pod image (ComfyUI + global volume)

# Construit l'image de pod et la pousse sur GHCR (GITHUB_TOKEN suffit, aucun secret à configurer).
# Aucun modèle ni secret dans l'image : les modèles viennent du global volume au démarrage.
# Tags : `latest` uniquement depuis main ; une autre branche sort en :<branche> (+ :<sha>).

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/comfyui-pod-global

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Le runner n'a que ~14 Go libres et la base PyTorch est grosse : on retire les SDK inutiles.
      - name: Liberer du disque
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
